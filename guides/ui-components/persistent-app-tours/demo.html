<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    #feature { 
      anchor-name: --feature; 
      margin: 100px; 
      padding: 20px; 
      background: #eee; 
      display: inline-block; 
    }

    #tour-step {
      popover: manual;
      position: fixed;
      position-anchor: --feature;
      position-area: right center;
      inset: auto;
      margin: 1rem;
      padding: 1rem;
      border: 1px solid blue;
      border-radius: 0.5rem;
      background: aliceblue;
    }
  </style>
</head>
<body>
  <div id="feature" tabindex="-1">New Feature</div>
  <div id="tour-step" popover="manual" role="dialog" aria-labelledby="tour-title">
    <h2 id="tour-title">Step 1</h2>
    <p>Interact with this feature!</p>
    <button popovertarget="tour-step" popovertargetaction="hide" onclick="moveFocus();">Got it</button>
  </div>
  <script>
    const tour = document.getElementById('tour-step');
    const feature = document.getElementById('feature');
    window.onload = () => {
      tour.showPopover();
      observeEscKeyDismiss();
    };

    function observeEscKeyDismiss() {
      document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        tour.hidePopover();
        moveFocus();
      }
      });
    }

    function moveFocus() {
      feature.focus();
    }
 
  </script>
</body>
</html>
